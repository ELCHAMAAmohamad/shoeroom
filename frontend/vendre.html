<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendre une paire — ShoeRoom</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@600&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== EN-TÊTE ===== -->
  <header class="entete">
    <a href="index.html" class="logo">ShoeRoom</a>
    <nav class="nav-principale">
      <a href="annonces.html">Annonces</a>
      <a href="boutique.html">Boutique</a>
      <a href="atelier.html">Atelier</a>
    </nav>
    <nav class="menu" id="menu">
      <a href="connexion.html">Connexion</a>
      <a href="inscription.html" class="lien-bouton">Inscription</a>
    </nav>
  </header>

  <!-- ===== TITRE DE LA PAGE ===== -->
  <section class="page-titre">
    <h1>Vendre une paire</h1>
    <p>Quelques informations et vos photos : votre annonce est en ligne tout de suite.</p>
  </section>

  <main class="page-vendre">
    <form class="carte-vendre" id="form-vendre" novalidate>

      <!-- 1. Les photos -->
      <h2>Photos</h2>
      <div class="champ">
        <label for="photos" class="zone-photos">
          <span class="zone-photos-titre">Choisir des photos</span>
          <span class="zone-photos-aide">1 à 10 photos · JPG ou PNG · 2 Mo maximum chacune</span>
        </label>
        <input type="file" id="photos" name="photos" accept="image/jpeg,image/png" multiple>
      </div>
      <div class="apercu-photos" id="apercu-photos"></div>

      <!-- 2. La paire -->
      <h2>La paire</h2>
      <div class="champ">
        <label for="titre">Titre</label>
        <input type="text" id="titre" name="titre" maxlength="150" placeholder="Ex. Air Max 90 blanches" required>
      </div>

      <div class="champ">
        <label for="marque">Marque</label>
        <input type="text" id="marque" name="marque" maxlength="100" placeholder="Ex. Nike" required>
      </div>

      <div class="champ-double">
        <div class="champ">
          <label for="size">Pointure</label>
          <input type="number" id="size" name="size" min="30" max="50" step="0.5" placeholder="Ex. 42" required>
        </div>
        <div class="champ">
          <label for="prix">Prix (€)</label>
          <input type="number" id="prix" name="prix" min="0" step="0.01" placeholder="Ex. 60" required>
        </div>
      </div>

      <div class="champ">
        <label for="etat">État</label>
        <select id="etat" name="etat" required>
          <option value="">Choisir…</option>
          <option value="neuves">Neuves</option>
          <option value="occasion">Occasion</option>
        </select>
      </div>

      <div class="champ">
        <label for="description">Description <span class="facultatif">(facultatif)</span></label>
        <textarea id="description" name="description" rows="5" placeholder="Portées combien de fois ? Boîte d'origine ? Défauts ?"></textarea>
      </div>

      <button type="submit" class="bouton">Publier l'annonce</button>
      <p class="message" id="message"></p>
    </form>
  </main>

  <!-- ===== PIED DE PAGE ===== -->
  <footer class="pied">
    <a href="index.html" class="logo">ShoeRoom</a>
    <p class="pied-copyright">© 2026 ShoeRoom — Projet M1 IHM 2D</p>
  </footer>

  <script src="js/auth.js"></script>
  <script src="js/vendre.js"></script>
</body>
</html>
