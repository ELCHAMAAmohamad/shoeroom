<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Annonces — ShoeRoom</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@600&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== EN-TÊTE ===== -->
  <header class="entete">
    <a href="index.html" class="logo">ShoeRoom</a>
    <nav class="nav-principale">
      <a href="annonces.html" class="actif">Annonces</a>
      <a href="boutique.html">Boutique</a>
      <a href="atelier.html">Atelier</a>
    </nav>
    <nav class="menu" id="menu">
      <a href="connexion.html">Connexion</a>
      <a href="inscription.html" class="lien-bouton">Inscription</a>
    </nav>
  </header>

  <!-- ===== TITRE DE LA PAGE ===== -->
  <section class="page-titre">
    <h1>Annonces</h1>
    <p>Des chaussures vendues par les membres de ShoeRoom, neuves ou d'occasion.</p>
  </section>

  <!-- ===== FILTRES À GAUCHE + ANNONCES À DROITE ===== -->
  <main class="page-annonces">

    <!-- Filtres -->
    <aside class="filtres">
      <form id="form-filtres">
        <h2>Filtrer</h2>

        <div class="champ">
          <label for="q">Recherche</label>
          <input type="text" id="q" placeholder="Mot-clé">
        </div>

        <div class="champ">
          <label for="marque">Marque</label>
          <input type="text" id="marque" placeholder="Ex. Nike">
        </div>

        <div class="champ">
          <label for="size">Pointure</label>
          <input type="number" id="size" min="30" max="50" step="0.5" placeholder="Ex. 42">
        </div>

        <div class="champ-double">
          <div class="champ">
            <label for="prixMin">Prix min (€)</label>
            <input type="number" id="prixMin" min="0" placeholder="0">
          </div>
          <div class="champ">
            <label for="prixMax">Prix max (€)</label>
            <input type="number" id="prixMax" min="0" placeholder="200">
          </div>
        </div>

        <div class="champ">
          <label for="etat">État</label>
          <select id="etat">
            <option value="">Tous</option>
            <option value="neuves">Neuves</option>
            <option value="occasion">Occasion</option>
          </select>
        </div>

        <button type="submit" class="bouton">Appliquer</button>
        <button type="button" class="bouton-lien" id="reinitialiser">Réinitialiser</button>
      </form>
    </aside>

    <!-- Liste des annonces (remplie par js/annonces.js) -->
    <section class="resultats">
      <p class="compteur" id="compteur">Chargement…</p>
      <div class="grille-annonces" id="grille-annonces"></div>
    </section>

  </main>

  <!-- ===== PIED DE PAGE ===== -->
  <footer class="pied">
    <a href="index.html" class="logo">ShoeRoom</a>
    <p class="pied-copyright">© 2026 ShoeRoom — Projet M1 IHM 2D</p>
  </footer>

  <script src="js/auth.js"></script>
  <script src="js/annonces.js"></script>
</body>
</html>
