<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — ShoeRoom</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@600&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- En-tête commun -->
  <header class="entete">
    <a href="index.html" class="logo">ShoeRoom</a>
    <nav class="menu" id="menu">
      <a href="index.html">Accueil</a>
      <a href="inscription.html">Inscription</a>
    </nav>
  </header>

  <!-- Formulaire de connexion -->
  <main class="page-formulaire">
    <div class="carte">
      <h1>Connexion</h1>
      <p class="sous-titre">Content de vous revoir.</p>

      <form id="form-connexion">
        <div class="champ">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="exemple@email.com" required>
        </div>
        <div class="champ">
          <label for="motDePasse">Mot de passe</label>
          <input type="password" id="motDePasse" required>
        </div>
        <button type="submit" class="bouton">Se connecter</button>
        <p class="message" id="message"></p>
      </form>

      <p class="lien-bas">Pas encore de compte ? <a href="inscription.html">Créer un compte</a></p>
    </div>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
